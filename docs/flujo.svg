<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 440" role="img" aria-labelledby="t d" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif">
<title id="t">Flujo de una tarea en xi-0</title>
<desc id="d">Una orden entra a xi-0, pasa por Planeación, Construcción y Calidad y entrega, y sale una rama lista para revisar. Un guardián revisa cada paso.</desc>
<style>
  .bg{fill:#f7f6f2}.card{fill:#fff;stroke:#d9d6cc}.ink{fill:#1d1c1a}.dim{fill:#6b675e}
  .chip{fill:#f1efe8;stroke:#e2dfd5}.core{fill:#1d1c1a}.coret{fill:#fff}.cored{fill:#bdb9ae}
  .p1{fill:#3b6fd4}.p2{fill:#c9772b}.p3{fill:#2f8f6b}
  .flow{stroke:#8a867b;stroke-width:2;fill:none;stroke-dasharray:6 6;animation:m 1.2s linear infinite}
  .head{fill:#8a867b}.back{stroke:#c0503e;stroke-width:1.6;fill:none;stroke-dasharray:4 4}.backt{fill:#c0503e}.backh{fill:#c0503e}
  .guard{fill:none;stroke:#8a867b;stroke-dasharray:3 5}
  @keyframes m{to{stroke-dashoffset:-12}}
  @media (prefers-reduced-motion:reduce){.flow{animation:none}}
  @media (prefers-color-scheme:dark){
    .bg{fill:#151517}.card{fill:#1e1e22;stroke:#34343b}.ink{fill:#ecebe6}.dim{fill:#9c9a92}
    .chip{fill:#27272c;stroke:#34343b}.core{fill:#ecebe6}.coret{fill:#151517}.cored{fill:#55534d}
    .p1{fill:#7aa2f0}.p2{fill:#e39a55}.p3{fill:#5cc09a}.flow{stroke:#77756e}.head{fill:#77756e}
    .back{stroke:#e07a68}.backt{fill:#e07a68}.backh{fill:#e07a68}.guard{stroke:#77756e}
  }
</style>
<rect class="bg" width="1140" height="440" rx="14"/>

<!-- orden -->
<rect class="card" x="20" y="150" width="140" height="64" rx="10"/>
<text class="ink" x="90" y="178" text-anchor="middle" font-size="15" font-weight="600" font-family="ui-monospace,Consolas,monospace">/xi-0 …</text>
<text class="dim" x="90" y="198" text-anchor="middle" font-size="12">tu orden</text>

<!-- xi-0 -->
<rect class="core" x="200" y="140" width="120" height="84" rx="12"/>
<text class="coret" x="260" y="176" text-anchor="middle" font-size="20" font-weight="700">xi-0</text>
<text class="cored" x="260" y="196" text-anchor="middle" font-size="11">elige la ruta</text>
<text class="cored" x="260" y="210" text-anchor="middle" font-size="11">y coordina</text>

<!-- fases -->
<g>
<rect class="card" x="360" y="40" width="170" height="284" rx="12"/>
<rect class="p1" x="360" y="40" width="170" height="5" rx="2.5"/>
<text class="p1" x="376" y="70" font-size="11" font-weight="700" letter-spacing="1">1 · PLANEACIÓN</text>
<text class="ink" x="376" y="92" font-size="16" font-weight="700">Norte</text>
<g font-size="12">
<rect class="chip" x="374" y="108" width="142" height="30" rx="7"/><text x="384" y="128"><tspan class="ink" font-weight="600">Atlas</tspan><tspan class="dim"> · Exploración</tspan></text>
<rect class="chip" x="374" y="144" width="142" height="30" rx="7"/><text x="384" y="164"><tspan class="ink" font-weight="600">Brújula</tspan><tspan class="dim"> · Producto</tspan></text>
<rect class="chip" x="374" y="180" width="142" height="30" rx="7"/><text x="384" y="200"><tspan class="ink" font-weight="600">Lumen</tspan><tspan class="dim"> · Diseño</tspan></text>
<rect class="chip" x="374" y="216" width="142" height="30" rx="7"/><text x="384" y="236"><tspan class="ink" font-weight="600">Plano</tspan><tspan class="dim"> · Arquitectura</tspan></text>
<rect class="chip" x="374" y="252" width="142" height="30" rx="7"/><text x="384" y="272"><tspan class="ink" font-weight="600">Sextante</tspan><tspan class="dim"> · Herram.</tspan></text>
</g>
<text class="dim" x="376" y="306" font-size="11">qué se hace y cómo</text>
</g>

<g>
<rect class="card" x="560" y="40" width="170" height="284" rx="12"/>
<rect class="p2" x="560" y="40" width="170" height="5" rx="2.5"/>
<text class="p2" x="576" y="70" font-size="11" font-weight="700" letter-spacing="1">2 · CONSTRUCCIÓN</text>
<text class="ink" x="576" y="92" font-size="16" font-weight="700">Yunque</text>
<g font-size="12">
<rect class="chip" x="574" y="108" width="142" height="30" rx="7"/><text x="584" y="128"><tspan class="ink" font-weight="600">Prisma</tspan><tspan class="dim"> · Front end</tspan></text>
<rect class="chip" x="574" y="144" width="142" height="30" rx="7"/><text x="584" y="164"><tspan class="ink" font-weight="600">Forja</tspan><tspan class="dim"> · Back end</tspan></text>
</g>
<text class="dim" x="576" y="306" font-size="11">el código, en su rama</text>
</g>

<g>
<rect class="card" x="760" y="40" width="170" height="284" rx="12"/>
<rect class="p3" x="760" y="40" width="170" height="5" rx="2.5"/>
<text class="p3" x="776" y="70" font-size="11" font-weight="700" letter-spacing="1">3 · CALIDAD Y ENTREGA</text>
<text class="ink" x="776" y="92" font-size="16" font-weight="700">Meridiano</text>
<g font-size="12">
<rect class="chip" x="774" y="108" width="142" height="30" rx="7"/><text x="784" y="128"><tspan class="ink" font-weight="600">Argos</tspan><tspan class="dim"> · QA</tspan></text>
<rect class="chip" x="774" y="144" width="142" height="30" rx="7"/><text x="784" y="164"><tspan class="ink" font-weight="600">Égida</tspan><tspan class="dim"> · Seguridad</tspan></text>
<rect class="chip" x="774" y="180" width="142" height="30" rx="7"/><text x="784" y="200"><tspan class="ink" font-weight="600">Códice</tspan><tspan class="dim"> · Docs</tspan></text>
<rect class="chip" x="774" y="216" width="142" height="30" rx="7"/><text x="784" y="236"><tspan class="ink" font-weight="600">Faro</tspan><tspan class="dim"> · DevOps</tspan></text>
</g>
<text class="dim" x="776" y="306" font-size="11">probado, revisado, entregado</text>
</g>

<!-- salida -->
<rect class="card" x="970" y="150" width="150" height="64" rx="10"/>
<text class="ink" x="1045" y="178" text-anchor="middle" font-size="14" font-weight="600" font-family="ui-monospace,Consolas,monospace">tarea/&lt;id&gt;</text>
<text class="dim" x="1045" y="198" text-anchor="middle" font-size="12">rama lista para revisar</text>

<!-- flechas -->
<g>
<path class="flow" d="M162 182H192"/><path class="head" d="M190 176l10 6-10 6z"/>
<path class="flow" d="M322 182H352"/><path class="head" d="M350 176l10 6-10 6z"/>
<path class="flow" d="M532 182H552"/><path class="head" d="M550 176l10 6-10 6z"/>
<path class="flow" d="M732 182H752"/><path class="head" d="M750 176l10 6-10 6z"/>
<path class="flow" d="M932 182H962"/><path class="head" d="M960 176l10 6-10 6z"/>
</g>

<!-- vuelta de QA -->
<path class="back" d="M845 326C845 356 645 356 645 334"/><path class="backh" d="M639 336l6-10 6 10z"/>
<text class="backt" x="745" y="366" text-anchor="middle" font-size="11">si QA encuentra una falla, vuelve</text>

<!-- guardián -->
<rect class="guard" x="200" y="384" width="730" height="38" rx="10"/>
<text x="565" y="408" text-anchor="middle" font-size="12.5"><tspan class="ink" font-weight="700">Guardián</tspan><tspan class="dim"> · un hook revisa cada comando, archivo y mensaje, y niega lo que rompe las reglas</tspan></text>
</svg>
