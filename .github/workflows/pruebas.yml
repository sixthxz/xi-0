name: pruebas

on:
  push:
    branches: [main, 'tarea/**']
  pull_request:

permissions:
  contents: read

jobs:
  pruebas:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Guardián
        run: node pruebas/guardian.test.js
      - name: Conformidad de documentos
        run: node pruebas/conformidad.test.js
      - name: Verificación en CI (ci.js)
        run: node pruebas/ci.test.js
      - name: Dependencias enlazadas (enlazar.js)
        run: node pruebas/enlazar.test.js
      - name: Tabla de tareas (metricas.js)
        run: node pruebas/metricas.test.js
      - name: Issues de fallas (reportar.js)
        run: node pruebas/reportar.test.js
